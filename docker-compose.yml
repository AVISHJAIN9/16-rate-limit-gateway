version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: rlgw-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: rlgw
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: rlgw-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  upstream:
    image: mendhak/http-https-echo:34
    container_name: rlgw-mock-upstream
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: 8080

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rlgw-gateway
    ports:
      - "8000:8000"
      - "9000:9000"
    depends_on:
      - mongodb
      - redis
      - upstream
    environment:
      NODE_ENV: production
      PORT: 8000
      ADMIN_PORT: 9000
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://mongodb:27017/rlgw

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: rlgw-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:10.3.3
    container_name: rlgw-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  mongo-data:
  grafana-data:
